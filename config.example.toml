[station]
name = "Backyard"
latitude = 40.5008            # Rutgers New Brunswick default; owner to update
longitude = -74.4474
timezone = "America/New_York"
elevation_m = 30

[tag]
allowed_tx_ids = [3378]       # REPLACE with the number on your tag's sticker. Empty list = accept any good-CRC tag (dev only)
expected_beacon_interval_s = 1.0   # overwritten by measured median once data flows
offline_warning_s = 30
offline_critical_s = 600
battery_installed = ""        # e.g. "2026-11-30", shown as battery age

[units]
display_temperature = "C"     # "C" or "F" (frontend can toggle per user)
temp_input_unit = "C"         # unit of the `temp:` field from pip_sense
humidity_scale = 1.0          # multiply raw humidity by this to get %RH (e.g. 0.01 if raw is RH*100)
temp_offset_c = 0.0           # calibration offset vs reference thermometer
humidity_offset_pct = 0.0

[validation]
temp_min_c = -40.0
temp_max_c = 85.0
rh_min = 0.0
rh_max = 100.0
max_temp_step_c_per_s = 2.0   # bigger jumps between consecutive packets are spikes
max_rh_step_per_s = 10.0
hampel_window = 7
hampel_sigma = 3.0

[smoothing]
ema_alpha = 0.2               # for live display smoothing
aggregate_minute = true

[light]
auto_calibrate = true
calibration_days = 7
saturation_detect = true
night_light_sigma = 5.0       # night-time light spike threshold = baseline + k*sigma

[home]
indoor_setpoint_c = 21.0      # used for "open windows" & condensation risk
indoor_rh_assumed = 40.0      # no indoor sensor; user can edit
window_u_value = 2.8          # W/m²K: single 5.8, double 2.8, triple 1.0

[thresholds]
freeze_c = 0.0
frost_watch_c = 3.0
heat_caution_hi_c = 26.7      # 80 °F
heat_extreme_caution_hi_c = 32.2  # 90 °F
heat_danger_hi_c = 39.4       # 103 °F
heat_extreme_danger_hi_c = 51.7   # 125 °F
fog_spread_c = 1.5
fog_rh = 95.0
open_window_dewpoint_max_c = 16.0
degree_day_base_c = 18.0
gdd_base_c = 10.0

[alerts]
cooldown_minutes = 60
email_enabled = false
email_to = ""
# SMTP creds via env: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM
browser_notifications = true
sound = false                 # chime on critical alerts while the dashboard is open

[server]
host = "127.0.0.1"            # use 0.0.0.0 to view from phone on same Wi-Fi
port = 8000
ingest_token = "change-me"    # collector must send header X-Ingest-Token
db_path = "data/weather.db"
raw_retention_days = 90       # aggregates kept forever

[collector]
server_url = "http://127.0.0.1:8000"
batch_max = 20
batch_interval_s = 1.0
spool_path = "data/spool.jsonl"
forward_bad_crc = true        # send BAD CRC packets too (stored for stats, never used as readings)
